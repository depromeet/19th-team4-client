name: Update agent skills

on:
  schedule:
    - cron: '30 21 * * 0' # 매주 월요일 06:30 KST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-agent-skills
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    env:
      DISABLE_TELEMETRY: '1'
      npm_config_ignore_scripts: 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # 러너에 에이전트 디렉터리가 하나도 없으면 skills CLI 가 모든 에이전트를 대상으로 삼아
      # 레포에 불필요한 디렉터리를 만든다. (vercel-labs/skills#2058)
      - name: Mark Claude Code as the installed agent
        run: mkdir -p "$HOME/.claude"

      - name: Update all skill sources
        run: npx --yes --package=skills@1.9.0 skills update --project --yes

      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-agent-skills
          delete-branch: true
          commit-message: 'chore: update external agent skills'
          title: 'chore: update external agent skills'
          body: |
            ## Summary
            Updates the external agent skills and their lockfile entries.

            - Review skill and lockfile changes before merging.
            - No custom validation or automerge.
          add-paths: |
            .agents/skills/
            .claude/skills/
            skills-lock.json
